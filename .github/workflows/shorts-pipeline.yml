name: Real Estate Shorts Pipeline

on:
  schedule:
    # 매일 오전 6시(KST, UTC 21:00 전날)에 체크. 실제로 이틀에 한 번만 돌리고
    # 싶다면 neighborhoods.json 갱신 커밋 로그를 기준으로 스크립트에서 간격을
    # 직접 판단하도록 확장하는 걸 권장합니다. 우선은 수동 실행(workflow_dispatch)
    # 으로 원하는 타이밍에 직접 돌리는 것도 방법입니다.
    - cron: "0 21 * * *"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      neighborhood: ${{ steps.pick.outputs.neighborhood }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - id: pick
        run: python scripts/pick_neighborhood.py

      - name: 대본 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_script.py "${{ steps.pick.outputs.neighborhood }}"

      - name: 대본을 Job Summary에 표시 (여기서 검수)
        run: python scripts/print_summary.py >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: script-${{ github.run_id }}
          path: script.json

  build-and-upload:
    needs: generate
    runs-on: ubuntu-latest
    # 이 environment에 필수 검토자(Jake 본인)를 등록해두면, generate 잡이 끝난 뒤
    # 여기서 자동으로 멈추고 승인 알림이 갑니다. Approve를 눌러야 다음으로 진행됩니다.
    # 설정 위치: 저장소 Settings → Environments → New environment → "upload-approval"
    #           → Required reviewers에 본인 계정 추가
    environment: upload-approval
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 시스템 의존성 설치 (ffmpeg, 한글 폰트)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-nanum

      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: script-${{ github.run_id }}

      - name: TTS 생성
        env:
          TYPECAST_API_KEY: ${{ secrets.TYPECAST_API_KEY }}
        run: python scripts/tts_typecast.py

      - name: 이미지 소싱
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python scripts/fetch_images.py

      - name: 영상 합성
        run: python scripts/assemble_video.py

      - name: 유튜브 업로드
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/upload_youtube.py

      - name: 소재 큐 갱신 커밋
        run: |
          python scripts/mark_used.py "${{ needs.generate.outputs.neighborhood }}"
          git config user.name "shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add neighborhoods.json
          git commit -m "mark ${{ needs.generate.outputs.neighborhood }} as used" || echo "변경 없음"
          git push
